<html th:replace="~{base :: layout(~{:: title}, ~{::content}, _, _)}">
  <th:block th:fragment="title" th:text="${pageTitle}"></th:block>

  <th:block th:fragment="content">
    <div class="row">
      <div class="col">
        <h1 th:text="${pageTitle}"></h1>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <form method="post" th:object="${todoForm}">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input
              type="text"
              class="form-control"
              th:field="*{title}"
              required
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('title')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
          </div>

          <div class="mb-3">
            <label for="dueDate" class="form-label">Data</label>
            <input
              type="date"
              class="form-control"
              th:field="*{dueDate}"
              required
            />
            <ul>
              <li
                th:each="error : ${#fields.errors('dueDate')}"
                th:text="${error}"
                class="text-danger"
              ></li>
            </ul>
          </div>

          <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
      </div>
    </div>
  </th:block>
</html>
