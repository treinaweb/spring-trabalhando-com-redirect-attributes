<!DOCTYPE html>
<html lang="pt-br" th:fragment="layout (title, content, styles, scripts)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TWTodos - <th:block th:replace="${title}"></th:block></title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Toastify CSS -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <th:block th:replace="${styles}"></th:block>
  </head>
  <body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/todos}">TWTodos</a>
      </div>
    </nav>

    <div class="container mt-4">
      <th:block th:replace="${content}"></th:block>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Feather Icons JS -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>

    <!-- Toastify JS -->
    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>

    <!-- Custom JS -->
    <script th:inline="javascript">
      // Feather Icons
      feather.replace();

      // Toastify
      const styles = {
        SUCCESS: {
          background: "linear-gradient(to right, #4CAF50, #4CAF50)",
        },
        ERROR: {
          background: "linear-gradient(to right, #FF416C, #FF4B2B)",
        },
      };

      const toast = /*[[${toast}]]*/ "";

      if (toast != null) {
        Toastify({
          text: toast.message,
          duration: 3000,
          close: true,
          stopOnFocus: true, // Prevents dismissing of toast on hover
          style: styles[toast.type],
        }).showToast();
      }
    </script>
    <th:block th:replace="${scripts}"></th:block>
  </body>
</html>
